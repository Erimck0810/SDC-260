<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        Author: Eric Mckinzy    
        Date: August 22, 2026
        Purpose: Willow & Pine Crafts store with local/session storage, cookies, and dynamic stock tracking.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willow & Pine Crafts</title>
    <link rel="stylesheet" href="PA_Storage-Central_StarterFile.css">
    <script src="PA_Storage-Central_StarterFile.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <h1>Willow & Pine Crafts</h1>
        </nav>
    </header>
    
    <main>
        <section class="welcome-section">
            <h2>Handmade With Care</h2>
            <p id="welcome-message"></p>
            <!-- LAST PURCHASED BANNER -->
            <div id="lastPurchasedContainer" class="last-purchased-banner"></div>
        </section>

        <section class="catalog-section">
            <h2 class="section-title">Our Handmade Collection</h2>
            <div id="productGrid" class="product-grid"></div>
        </section>
        <aside class="cart-section" aria-live="polite">
            <h2>Your Shopping Cart</h2>
            <div id="cartItems" class="cart-items-container"></div>
            
            <div class="cart-summary">
                <p>Total Products: <span id="cartCount">0</span></p>
                <p class="session-tracker">Added This Session: <span id="sessionAddedCount">0</span></p>
                <p class="cart-total-price">Total Cost: $<span id="cartTotal">0.00</span></p>
            </div>

            <div class="cart-actions">
                <button id="checkoutBtn" type="button" class="btn-checkout">Checkout</button>
                <button id="clearCartBtn" type="button" class="btn-clear">Clear Cart</button>
            </div>
        </aside>
    </main>

    <footer>
        <p>Willow & Pine Crafts • Open Daily • Artisanal Goods</p>
    </footer>
</body>
</html>
